# ::::::::::::::::::::::::::::::::::::::::::::::::::::::
# :: PANDAS-Kademlia Configuration
# ::::::::::::::::::::::::::::::::::::::::::::::::::::::

# ::::: GLOBAL ::::::
network.size = 100
simulation.endtime = 10000

# ::::: LAYERS :::::
protocol.0 = peersim.core.IdleProtocol

protocol.1 = peersim.transport.UniformRandomTransport
protocol.1.mindelay = 100
protocol.1.maxdelay = 100

protocol.2 = peersim.transport.UnreliableTransport
protocol.2.drop = 0
protocol.2.transport = 1

protocol.3kademlia = peersim.kademlia.KademliaProtocol
protocol.3kademlia.transport = 2
protocol.3kademlia.BITS = 256  # Kademlia uses 256-bit keys

# ::::: PANDAS PROTOCOL (Layered on Kademlia) :::::
protocol.4pandas = peersim.gossipsub.PANDAS.PANDASProtocol
protocol.4pandas.protocol = 4pandas  
protocol.4pandas.kademlia = 3kademlia  
protocol.4pandas.par_builder = 123
protocol.4pandas.forkChoiceStrategy = "TightForkChoice"

# ::::: INITIALIZERS :::::
init.0 = peersim.dynamics.WireKOut
init.0.k = 5
init.0.protocol = 0

init.1 = peersim.kademlia.CustomDistribution
init.1.protocol = 3kademlia

init.2 = peersim.kademlia.StateBuilder
init.2.protocol = 3kademlia
init.2.transport = 2

init.3 = peersim.gossipsub.PANDAS.NetworkInitializer
init.3.protocol = 4pandas

# ::::: CONTROLS :::::

# Kademlia traffic generator
control.0 = peersim.kademlia.TrafficGenerator
control.0.protocol = 3kademlia
control.0.step = 100

# PANDAS traffic generator
control.1 = peersim.gossipsub.PANDAS.TrafficGenerator
control.1.protocol = 4pandas
control.1.step = 100

# Logging
control.2 = peersim.gossipsub.PANDAS.LoggerControl
control.2.protocol = 4pandas
control.2.step = 100

# Fork-Choice Observer
control.3 = peersim.gossipsub.PANDAS.ForkChoiceObserver
control.3.protocol = 4pandas
control.3.step = 100
