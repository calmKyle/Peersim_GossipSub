########################################################################
#  Gossip + Malicious Configuration Example
########################################################################

# ::::: GLOBAL :::::

SIZE 16500
NUMBER_OF_VALIDATORS 16384
SIM_TIME 60000
GOSSIP_FACTOR 0.25
ALLOW_EXCEED_D_HIGH_ON_DOUT true

MALICIOUS_RATE 0.4

FLOOD_PAYLOAD 256   # bytes
FLOOD_RATE 150      # messages per heartbeat per topic
FLOOD_RATE 0      # 10% nodes are flooders

SAMPLE_AMOUNT 73
THRESHOLD (SHARD_AMOUNT + 1) / 2
#THRESHOLD 1

ADAPTIVE_SAMPLING true
PARALLEL_ASK 1
PARALLEL_ASK_HIGH DEGREE

MINDELAY  50
MAXDELAY  300

MIN_DEGREE 6
MAX_DEGREE 12
D_LAZY 6
DEGREE 8
IHAVE_FANOUT 8
# D_out ~= min(D_LOW - 1, D/2), guarentee ≥ 1

DEBUG_GOSSIPSUB false

TRAFFIC_STEP 12000
BANDWIDTH_CONTROLLER_STEP 100
OBSERVER_STEP 3999
TURBULENCE_STEP (SIM_TIME*20)/SIZE


DISTRIBUTION_STRATEGY 2

NUMBER_OF_ROWS 512
NUMBER_OF_COLUMNS 512

# config of topic and how many row/column per topic
NUMBER_OF_TOPICS 1024
NUMBER_ROWS_OR_COLS_PER_TOPIC 1

# config of shard level per row and col
SHARD_AMOUNT 8
SHARD_COPIES 2
NUMBER_COPIES_DISTRIBUTED 1

# --- adaptive gossip (GossipSub v1.1) -----------------
USE_ADAPTIVE_GOSSIP             true
ADAPTIVE_GOSSIP_DECAY           0.5
ADAPTIVE_GOSSIP_THRESHOLD       0.3


INTERFACE_BANDWIDTH 3750000
BLOCK_PRODUCER_BANDWIDTH 1250000000

NUMBER_OF_ROWS_AND_COLS_IN_A_TOPIC (NUMBER_OF_ROWS+NUMBER_OF_COLUMNS)/NUMBER_OF_TOPICS
NUMBER_OF_VALIDATORS_PER_TOPIC NUMBER_OF_VALIDATORS/NUMBER_OF_TOPICS

# shard amount
# ROW_OR_COLUMN_HOLDERS_PER_TOPIC 16

random.seed 500121
simulation.experiments 1
simulation.endtime SIM_TIME
network.size SIZE


########################################################################
# ::::: PROTOCOL DEFINITIONS ::::: 
########################################################################

# 1) Uniform Random Transport (for basic latency)
protocol.1uniftr peersim.transport.UniformRandomTransport
protocol.1uniftr.mindelay MINDELAY
protocol.1uniftr.maxdelay MAXDELAY

# 2) UnreliableTransport that uses the above random transport
protocol.2unreltr peersim.transport.UnreliableTransport
protocol.2unreltr.drop 0
protocol.2unreltr.transport 1uniftr

# 3) Normal GossipSub protocol
protocol.3GossipSub peersim.GossipSub.GossipSubProtocol
protocol.3GossipSub.transport 2unreltr

########################################################################
# ::::: INITIALIZERS ::::: 
########################################################################

# 1) Assign unique node IDs, build topics, etc.
init.1uniqueNodeID peersim.GossipSub.CustomDistribution
init.1uniqueNodeID.protocol 3GossipSub



########################################################################
# ::::: CONTROLS ::::: 
########################################################################

# (Optional) Traffic generator 
control.0traffic peersim.GossipSub.TrafficGenerator
control.0traffic.protocol 3GossipSub
control.0traffic.step TRAFFIC_STEP

# (Optional) Dynamic Mesh 
control.1dynamicMesh peersim.GossipSub.DynamicMeshControl
control.1dynamicMesh.protocol 3GossipSub
control.1dynamicMesh.step BANDWIDTH_CONTROLLER_STEP

# (Optional) GossipSub Observer 
control.3 peersim.GossipSub.GossipSubObserver
control.3.protocol 3GossipSub
control.3.time     4000
control.3.step    12000
